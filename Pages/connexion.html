<section class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container">
        <div class="row align-items-center justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="bg-light rounded-5 p-4 border border-primary" id="form-connexion">
                    <form action="" class="row p-5 g-3">
                        <h1 class="h1 text-primary text-center">Connectez-vous</h1><hr class="mb-4">
                        <label for="identifiant" class="h5 text-primary">Identifiant</label>
                        <input type="text" id="identifiant" class="mb-4 form-control" name="identifiant" required autocomplete="username">
                        <label for="password" class="h5 text-primary">Mot de passe</label>
                        <input type="password" id="password" class="form-control" name="password" required autocomplete="current-password">
                        <span class="mb-5"><a href="#" class="text-grey" onclick="route(event)">Mot de passe oublié ?</a></span>
                        <button type="submit" class="btn btn-primary btn-lg btn-form">Se connecter</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
