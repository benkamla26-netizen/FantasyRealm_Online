<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-12 col-lg-4">
                <h1 class="text-primary text-center text-lg-start fw-bold">Créer un personnage</h1>
                <div class="card my-5">
                    <img src="/images/maker-neutre.jpg" class="card-img-top" alt="Créez votre personnage">
                    <div class="card-body bg-light">
                        <h5 class="card-title">Nom</h5>
                        <div class="row rounded bg-primary p-3 text-white mx-2 mt-3 align-items-center">
                            <i class="bi bi-info-circle col-1"></i>
                            <p class="card-text col-11">Votre personnage sera vérifié  par l'équipe de l'entreprise avant de pouvoir le finaliser et le partager.</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-8 bg-light rounded-5 p-4">
                <form action="">
                    <h4 class="text-primary text-center text-lg-start fw-bold">Identité</h4><hr/>
                    <label for="nom-personnage" class="">Nom de personnage *</label><input type="text" id="nom-personnage" name="nom" placeholder="nom" class="w-100 form-control rounded-3 my-3">
                    <p class="text-grey">Le nom doit être unique</p><hr/>
                    <fieldset>
                        <div class="row justify-content-between mx-5 my-3 position-relative">
                            <input type="radio" class="btn-check" id="homme" name="genre" value="homme" required checked><label for="homme" title="Homme" class="btn btn-outline-primary btn-lg col-12 col-lg-5">Homme</label>
                            <input type="radio" class="btn-check" id="femme" name="genre" value="femme"><label for="femme" title="Femme" class="btn btn-outline-primary btn-lg col-12 col-lg-5">Femme</label>
                        </div>
                    </fieldset>
                    <div class="my-5">
                        <h4 class="text-primary text-center text-lg-start fw-bold">Traits de visage</h4><hr/>
                        <div class="row g-3">
                            <div class="col-12 col-lg-5">
                                <label for="visage" class="form-label">Forme du visage</label>
                                <select id="visage" name="visage" class="form-select">
                                    <option value="rond" selected>Rond</option>
                                    <option value="carre">Carré</option>
                                    <option value="rectangulaire">Rectangulaire</option>
                                    <option value="ovale">Ovale</option>
                                </select>
                            </div>
                            <div class="col-12 col-lg-5">
                                <label for="nez" class="form-label">Forme du nez</label>
                                <select id="nez" name="nez" class="form-select">
                                    <option value="rond" selected>Rond</option>
                                    <option value="carre">Carré</option>
                                    <option value="rectangulaire">Rectangulaire</option>
                                    <option value="ovale">Ovale</option>
                                </select>
                            </div>
                            <div class="col-12 col-lg-5">
                                <label for="yeux" class="form-label">Forme des yeux</label>
                                <select id="yeux" name="yeux" class="form-select">
                                    <option value="rond" selected>Rond</option>
                                    <option value="carre">Carré</option>
                                    <option value="rectangulaire">Rectangulaire</option>
                                    <option value="ovale">Ovale</option>
                                </select>
                            </div>
                            <div class="col-12 col-lg-5">
                                <label for="bouche" class="form-label">Forme de la bouche</label>
                                <select id="bouche" name="bouche" class="form-select">
                                    <option value="rond" selected>Rond</option>
                                    <option value="carre">Carré</option>
                                    <option value="rectangulaire">Rectangulaire</option>
                                    <option value="ovale">Ovale</option>
                                </select>
                            </div>
                            <div class="col-12 col-lg-5">
                                <label for="oreilles" class="form-label">Forme des oreilles</label>
                                <select id="oreilles" name="oreilles" class="form-select">
                                    <option value="rond" selected>Rond</option>
                                    <option value="carre">Carré</option>
                                    <option value="rectangulaire">Rectangulaire</option>
                                    <option value="ovale">Ovale</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="my-5">
                        <h4 class="text-primary text-center text-lg-start fw-bold">Couleurs</h4><hr/>
                        <div class="row g-3">
                            <div class="col-12 col-lg-5">
                                <label for="peau" class="form-label">Peau</label>
                                <select id="peau" name="peau" class="form-select">
                                    <option value="rouge" selected>Rouge</option>
                                    <option value="bleu">Bleu</option>
                                    <option value="vert">Vert</option>
                                    <option value="jaune">Jaune</option>
                                </select>
                            </div>
                            <div class="col-12 col-lg-5">
                                <label for="cheveux" class="form-label">Cheveux</label>
                                <select id="cheveux" name="cheveux" class="form-select">
                                    <option value="rouge" selected>Rouge</option>
                                    <option value="bleu">Bleu</option>
                                    <option value="vert">Vert</option>
                                    <option value="jaune">Jaune</option>
                                </select>
                            </div>
                            <div class="col-12 col-lg-5">
                                <label for="yeux-color" class="form-label">Yeux</label>
                                <select id="yeux-color" name="yeux-color" class="form-select">
                                    <option value="rouge" selected>Rouge</option>
                                    <option value="bleu">Bleu</option>
                                    <option value="vert">Vert</option>
                                    <option value="jaune">Jaune</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="my-3">
                        <h4 class="text-primary text-center text-lg-start fw-bold">Cheveux</h4><hr/>
                        <label for="coiffure" class="form-label">Coiffure</label>
                        <select id="coiffure" name="coiffure" class="form-select">
                            <option value="court" selected>Court</option>
                            <option value="long">Long</option>
                            <option value="attache">Attaché</option>
                            <option value="rase">Rasé</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-end gap-3 mt-5">
                            <button type="button" class="btn btn-lg btn-outline-primary px-5">Annuler</button>
                            <button type="submit" class="btn btn-lg btn-primary px-5">Sauvegarder</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
